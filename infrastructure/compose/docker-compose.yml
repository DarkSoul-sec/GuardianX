name: guardianx

services:
  postgres:
    image: postgres:16
    container_name: guardianx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardianx}
      # Bootstrap administrator. Used ONLY for initial provisioning (creating
      # roles/grants); never used by the running application.
      POSTGRES_USER: ${POSTGRES_USER:-guardianx}
      # All three database passwords are REQUIRED. The stack refuses to start
      # when they are missing or still placeholders (see the entrypoint guard
      # below), so a default/guessable credential can never be deployed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in infrastructure/compose/.env (copy .env.example and set it)}
      # Migration + runtime role credentials (used by db-init + backend).
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-guardianx_migrate}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is not set in infrastructure/compose/.env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-guardianx_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is not set in infrastructure/compose/.env}
    # Credential guard: fails fast with an actionable message before PostgreSQL
    # initdb/runtime if a database password is missing, a placeholder, or too
    # short, then execs the official image entrypoint unchanged.
    entrypoint:
      - bash
      - /usr/local/bin/guardianx-postgres-entrypoint.sh
    # Keep the image default command (postgres) explicit: some Compose
    # versions reset the image CMD to empty when entrypoint is overridden.
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs on a fresh data directory only; the db-init service covers the
      # first upgrade of existing volumes (re-provision anytime with
      # `docker compose run --rm db-init`).
      - ../docker/db-init.sh:/docker-entrypoint-initdb.d/01-guardianx-db-init.sh:ro
      - ../docker/postgres-entrypoint.sh:/usr/local/bin/guardianx-postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardianx} -d ${POSTGRES_DB:-guardianx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot provisioning: creates the least-privilege roles (guardianx_migrate,
  # guardianx_app), transfers ownership, applies grants and default privileges.
  # Fully idempotent. It runs on the first `docker compose up` (upgrading an
  # existing volume in place) and whenever its configuration changes. To
  # re-provision at any time, run: docker compose run --rm db-init
  db-init:
    image: postgres:16
    container_name: guardianx-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardianx}
      POSTGRES_USER: ${POSTGRES_USER:-guardianx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in infrastructure/compose/.env}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-guardianx_migrate}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is not set in infrastructure/compose/.env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-guardianx_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is not set in infrastructure/compose/.env}
      PROVISION_DB_HOST: postgres
      PROVISION_DB_PORT: "5432"
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/01-guardianx-db-init.sh"]
    volumes:
      - ../docker/db-init.sh:/docker-entrypoint-initdb.d/01-guardianx-db-init.sh:ro

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: guardianx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: GuardianX
      APP_VERSION: 1.0.0
      API_PREFIX: /api
      AUTH_MODE: ${AUTH_MODE:-local}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-guardianx}
      # Runtime role: least-privilege guardianx_app (never a superuser).
      DATABASE_USER: ${POSTGRES_APP_USER:-guardianx_app}
      DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me-in-production}
      # Migration + bootstrap credentials are consumed ONLY by the entrypoint
      # (alembic step) and stripped from the uvicorn process environment.
      POSTGRES_DB: ${POSTGRES_DB:-guardianx}
      POSTGRES_USER: ${POSTGRES_USER:-guardianx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in infrastructure/compose/.env}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-guardianx_migrate}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is not set in infrastructure/compose/.env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-guardianx_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is not set in infrastructure/compose/.env}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in docker-compose .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-GuardianX <noreply@localhost>}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-15}
    entrypoint: ["sh", "/usr/local/bin/backend-entrypoint.sh"]
    volumes:
      - ../docker/backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    container_name: guardianx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1 (not localhost): in the Alpine image localhost resolves to
      # ::1, but nginx listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
